<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Fetch & Debug Tester</title>
    <style>
        :root { 
            --bg-color: #f8f9fa; 
            --primary: #007bff; 
            --code-bg: #1e1e1e; 
            --code-text: #d4d4d4; 
            --border: #dee2e6;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        h1 { margin-top: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        h3 { margin: 15px 0 5px 0; font-size: 0.95rem; color: #555; }
        
        /* 左右2カラムのレイアウト */
        .workspace { display: flex; gap: 20px; height: calc(100vh - 80px); min-height: 600px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); box-sizing: border-box; }
        .left-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .right-panel { flex: 1.2; display: flex; flex-direction: column; }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; }
        select { width: 100px; flex-shrink: 0; font-family: sans-serif; }
        textarea { min-height: 80px; resize: vertical; }
        
        button { background: var(--primary); color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { opacity: 0.9; }
        
        /* タブ切り替え（コード vs プレビュー） */
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 10px; }
        .tab { padding: 8px 16px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
        
        .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }

        pre { background: var(--code-bg); color: var(--code-text); padding: 15px; border-radius: 4px; overflow: auto; margin: 0; flex: 1; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
        
        /* 安全な受皿となるiframe */
        .preview-frame { width: 100%; flex: 1; border: 1px solid var(--border); border-radius: 4px; background: white; }
        .status-badge { background: #6c757d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; font-family: monospace; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>🌐 Web Fetch & Debug Tester</h1>

<div class="workspace">
    <div class="panel left-panel">
        <h3>Target URL</h3>
        <div class="input-group">
            <button id="backBtn" onclick="goBack()" style="width: 45px; padding: 10px; background: #6c757d;" disabled>←</button>
            <button id="forwardBtn" onclick="goForward()" style="width: 45px; padding: 10px; background: #6c757d;" disabled>→</button>
            
            <select id="method">
                <option value="GET" selected>GET</option>
                <option value="POST">POST</option>
            </select>
            <input type="text" id="url" value="https://duckduckgo.com/" placeholder="https://example.com">
        </div>

        <h3>Headers (JSON)</h3>
        <textarea id="headers" placeholder='{"User-Agent": "Bot"}'>{}</textarea>

        <h3>Body (JSON or Text)</h3>
        <textarea id="body" placeholder='{"key": "value"}'></textarea>

        <div style="margin-top: auto; padding-top: 15px;">
            <button id="sendBtn" onclick="sendViaProxy()">Fetch & Preview</button>
        </div>
    </div>

    <div class="panel right-panel">
        <div>
            <span class="status-badge" id="statusCode">Status: Ready</span>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('preview')">HTML Preview</button>
            <button class="tab" onclick="switchTab('code')">Raw Response</button>
            <button class="tab" onclick="switchTab('headers-tab')">Headers</button>
        </div>

        <div id="tab-preview" class="tab-content active">
           <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>

        <div id="tab-code" class="tab-content">
            <pre id="responseBody">Waiting for fetch...</pre>
        </div>

        <div id="tab-headers-tab" class="tab-content">
            <pre id="responseHeaders">Waiting for fetch...</pre>
        </div>
    </div>
</div>

<script>
    // 履歴管理用の配列とポインタ
    let historyStack = [];
    let currentHistoryIndex = -1;
    let isNavigatingHistory = false; 

    // タブ切り替えロジック
function switchTab(e, tabName) { // 引数に e (event) を追加
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    e.target.classList.add('active'); // e.target に変更
    document.getElementById(`tab-${tabName}`).classList.add('active');
}

    async function sendViaProxy() {
        const method = document.getElementById('method').value;
        const targetUrl = document.getElementById('url').value;
        const headersText = document.getElementById('headers').value;
        const bodyText = document.getElementById('body').value;

        const statusCodeEl = document.getElementById('statusCode');
        const headersEl = document.getElementById('responseHeaders');
        const bodyEl = document.getElementById('responseBody');
        const previewFrame = document.getElementById('previewFrame');

        statusCodeEl.textContent = 'Status: Fetching...';
        statusCodeEl.style.background = '#007bff';

        let headers = {};
        let bodyData = null;
        try {
            if (headersText.trim()) headers = JSON.parse(headersText);
            if (bodyText.trim() && method !== 'GET') {
                try { bodyData = JSON.parse(bodyText); } catch { bodyData = bodyText; }
            }
        } catch (e) {
            alert("JSONフォーマットエラーです。末尾のカンマなどを確認してください:\n" + e.message);
            return;
        }

        try {
            const res = await fetch('/proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUrl, method, headers, body: bodyData })
            });

            const result = await res.json();

            // ステータス表示
            statusCodeEl.textContent = `Status: ${result.status} ${result.statusText || ''}`;
            statusCodeEl.style.background = result.status >= 200 && result.status < 300 ? '#28a745' : '#dc3545';

            // ヘッダー表示
            headersEl.textContent = JSON.stringify(result.headers, null, 2);

            // ボディ（HTML等）の処理
            let htmlContent = '';
            if (typeof result.data === 'object') {
                htmlContent = JSON.stringify(result.data, null, 2);
            } else {
                htmlContent = result.data || '';
            }

            bodyEl.textContent = htmlContent;

            // 💡 読み込み完了イベントをセットしてから srcdoc に注入する
            previewFrame.onload = function() {
                const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                if (!iframeDoc) return;

                // iframe内のすべてのフォームを横取り対象にする
                iframeDoc.querySelectorAll('form').forEach(form => {
                    // 重複登録を避けるため、一回リスナーを綺麗にするハック
                    form.onsubmit = null; 
                    form.addEventListener('submit', function(event) {
                        event.preventDefault();

                        const actionUrl = form.getAttribute('data-proxy-action') || form.action;
                        const method = (form.getAttribute('data-proxy-method') || form.method || 'GET').toUpperCase();

                        const formData = new FormData(form);
                        let bodyObj = {};
                        
                        if (method === 'POST') {
                            formData.forEach((value, key) => {
                                bodyObj[key] = value;
                            });
                        } else {
                            const params = new URLSearchParams(formData).toString();
                            if (params) {
                                const separator = actionUrl.includes('?') ? '&' : '?';
                                document.getElementById('url').value = actionUrl + separator + params;
                            } else {
                                document.getElementById('url').value = actionUrl;
                            }
                        }

                        if (method === 'POST') {
                            document.getElementById('url').value = actionUrl;
                            document.getElementById('body').value = JSON.stringify(bodyObj, null, 2);
                        } else {
                            document.getElementById('body').value = '';
                        }
                        
                        document.getElementById('method').value = method;
                        sendViaProxy();
                    });
                });
            };

            // 安全なiframeにHTMLを流し込む
            previewFrame.srcdoc = htmlContent;

            // 履歴の追加とボタンの有効/無効化
            if (!isNavigatingHistory) {
                historyStack = historyStack.slice(0, currentHistoryIndex + 1);
                historyStack.push({ url: targetUrl, method: method, body: bodyText });
                currentHistoryIndex = historyStack.length - 1;
            }
            isNavigatingHistory = false;

            document.getElementById('backBtn').disabled = (currentHistoryIndex <= 0);
            document.getElementById('forwardBtn').disabled = (currentHistoryIndex >= historyStack.length - 1);

        } catch (error) {
            statusCodeEl.textContent = "Status: Error";
            statusCodeEl.style.background = '#dc3545';
            bodyEl.textContent = "Proxy接続エラー:\n" + error.message;
            previewFrame.srcdoc = "<p style='color:red;'>Fetchに失敗しました。</p>";
        }
    }

    // iframe内の画像が読み込みに失敗したときに呼び出される関数
    function handleImageError(imgElement) {
        if (imgElement.getAttribute('data-proxied') === 'true') return;

        const originalSrc = imgElement.getAttribute('data-original-src');
        
        imgElement.style.display = 'inline-block';
        imgElement.style.width = imgElement.width > 30 ? imgElement.width + 'px' : '50px';
        imgElement.style.height = imgElement.height > 30 ? imgElement.height + 'px' : '50px';
        imgElement.style.border = '1px dashed #ccc';
        imgElement.style.background = '#f0f0f0';
        imgElement.style.cursor = 'pointer';
        
        imgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' viewBox='0 0 24 24'><text x='50%' y='55%' font-size='16' text-anchor='middle' dominant-baseline='middle'>↻</text></svg>";
        imgElement.title = "クリックしてサーバー経由で画像を再読み込み";

        imgElement.onclick = function() {
            const proxyUrl = `/proxy-image?url=${encodeURIComponent(originalSrc)}`;
            this.setAttribute('data-proxied', 'true');
            this.src = proxyUrl;
            
            this.style.border = 'none';
            this.style.background = 'transparent';
            this.style.cursor = 'default';
            this.onclick = null;
        };
    }

    // 戻る・進むの実行関数 
    function goBack() {
        if (currentHistoryIndex > 0) {
            currentHistoryIndex--;
            isNavigatingHistory = true;
            loadHistory(historyStack[currentHistoryIndex]);
        }
    }

    function goForward() {
        if (currentHistoryIndex < historyStack.length - 1) {
            currentHistoryIndex++;
            isNavigatingHistory = true;
            loadHistory(historyStack[currentHistoryIndex]);
        }
    }

    function loadHistory(historyItem) {
        document.getElementById('url').value = historyItem.url;
        document.getElementById('method').value = historyItem.method;
        document.getElementById('body').value = historyItem.body || '';
        sendViaProxy();
    }
</script>

</body>
</html>
